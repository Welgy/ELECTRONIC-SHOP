<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Витрина техники — ELECTRONIC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- шапка сайта -->
            <header class="site-header">
        <a href="index.html" class="logo">ELECTRONIC</a>
        
        <!-- центральный блок -->
        <div class="header-center">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Поиск">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
            
            <nav class="main-nav">
                <a href="index.html" class="active">Каталог</a>
                <a href="about.html">О компании</a>
                <a href="contacts.html">Контакты</a>
            </nav>
        </div>

                <div class="header-right">
            <a href="favorites.html" class="fav-link">
                <div class="cart-icon-wrapper">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                    <span class="fav-count">0</span>
                </div>
                <span style="margin-top: 5px;">Избранное</span>
            </a>

            <a href="cart.html" class="cart-link" id="cart-icon">
                <div class="cart-icon-wrapper">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="cart-count">0</span>
                </div>
                <span style="margin-top: 5px;">Корзина</span>
            </a>
        </div>
    </header>

    <div class="main-container">
        
        <!-- фильтры -->
        <aside class="sidebar-filters">
    <h3>Фильтры</h3>
    <div class="filter-group">
        <h4>Модель</h4>
        <div class="tabs-container category-tabs">
            <label class="tab-label">
                <input type="radio" name="category" class="category-cb" data-category="iphone">
                <span>iPhone</span>
            </label>
            <label class="tab-label">
                <input type="radio" name="category" class="category-cb" data-category="macbook">
                <span>MacBook</span>
            </label>
            <label class="tab-label">
                <input type="radio" name="category" class="category-cb" data-category="airpods">
                <span>AirPods</span>
            </label>
        </div>
        <div class="sub-filters" id="sub-iphone" style="display: none;">
            <label><input type="checkbox" class="filter-cb" data-filter="model" value="iPhone 17 Pro Max"> iPhone 17 Pro Max</label>
            <label><input type="checkbox" class="filter-cb" data-filter="model" value="iPhone 17"> iPhone 17</label>
            <label><input type="checkbox" class="filter-cb" data-filter="model" value="iPhone 16 Pro Max"> iPhone 16 Pro Max</label>
            <label><input type="checkbox" class="filter-cb" data-filter="model" value="iPhone 16"> iPhone 16</label>
            <label><input type="checkbox" class="filter-cb" data-filter="model" value="iPhone 15 Pro Max"> iPhone 15 Pro Max</label>
            <label><input type="checkbox" class="filter-cb" data-filter="model" value="iPhone 15"> iPhone 15</label>
        </div>
        <div class="sub-filters" id="sub-macbook" style="display: none;">
            <label><input type="checkbox" class="filter-cb" data-filter="model" value="MacBook Air"> MacBook Air</label>
        </div>
        <div class="sub-filters" id="sub-airpods" style="display: none;">
            <label><input type="checkbox" class="filter-cb" data-filter="model" value="AirPods Pro"> AirPods Pro</label>
        </div>
    </div>
    <div class="filter-group">
        <h4>Встроенная память</h4>
        <label><input type="checkbox" class="filter-cb" data-filter="memory" value="128GB"> 128 ГБ</label>
        <label><input type="checkbox" class="filter-cb" data-filter="memory" value="256GB"> 256 ГБ</label>
        <label><input type="checkbox" class="filter-cb" data-filter="memory" value="512GB"> 512 ГБ</label>
        <label><input type="checkbox" class="filter-cb" data-filter="memory" value="1TB"> 1 ТБ</label>
    </div>
    <div class="filter-group">
        <h4>Цвет</h4>
        <label><input type="checkbox" class="filter-cb" data-filter="color" value="Black"> Черный (Black)</label>
        <label><input type="checkbox" class="filter-cb" data-filter="color" value="White"> Белый (White)</label>
        <label><input type="checkbox" class="filter-cb" data-filter="color" value="Blue"> Синий (Blue)</label>
        <label><input type="checkbox" class="filter-cb" data-filter="color" value="Green"> Зеленый (Green)</label>
        <label><input type="checkbox" class="filter-cb" data-filter="color" value="Pink"> Розовый (Pink)</label>
        <label><input type="checkbox" class="filter-cb" data-filter="color" value="Fiol"> Фиолетовый (Fiol)</label>
        <label><input type="checkbox" class="filter-cb" data-filter="color" value="Orange"> Оранжевый (Orange)</label>
    </div>
    <div class="filter-group">
        <h4>Диагональ экрана</h4>
        <label><input type="checkbox" class="filter-cb" data-filter="screen" value="6.1"> 6.1"</label>
        <label><input type="checkbox" class="filter-cb" data-filter="screen" value="6.3"> 6.3"</label>
        <label><input type="checkbox" class="filter-cb" data-filter="screen" value="6.9"> 6.9"</label>
        <label><input type="checkbox" class="filter-cb" data-filter="screen" value="13.6"> 13.6" (MacBook)</label>
    </div>
    <div class="filter-group">
        <h4>Цена (BYN)</h4>
        <input type="range" id="price-range" min="0" max="5000" value="5000" step="50" style="width: 100%;">
        <div style="display: flex; justify-content: space-between; font-size: 13px; margin-top: 5px; color: #666;">
            <span>0</span>
            <span id="price-value">5000</span>
        </div>
    </div>
    
    <button id="reset-filters" style="width: 100%; padding: 8px; margin-top: 10px; cursor: pointer; background: #eee; border: 1px solid #ccc; border-radius: 4px;">Сбросить фильтры</button>
</aside>

        <main class="products-grid" id="products-container"></main>
    </div>
    <script src="products-data.js"></script>
    <script src="cart.js"></script>
    <script src="app.js"></script>
</body>
</html>
